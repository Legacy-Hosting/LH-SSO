name: SSO Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: legacyhosting_sso
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:test-password@127.0.0.1:3306/legacyhosting_sso
      LH_DISCORD_INTERNAL_TOKEN: ci-only-internal-token-with-32-characters
    steps:
      - uses: actions/checkout@v7
        with:
          path: service
          fetch-depth: 0
      - name: Verify immutable release ref
        working-directory: service
        shell: bash
        run: |
          [[ "$GITHUB_REF_TYPE" == tag ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$tag_ref")" = tag
          tag_commit=$(git rev-list -n 1 "$tag_ref")
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$tag_commit" FETCH_HEAD
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p "require('./package.json').version")"
      - name: Prepare local release artifact
        run: mkdir releases && git -C releases init
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: service/pnpm-lock.yaml
      - name: Verify and build
        working-directory: service
        run: |
          pnpm install --frozen-lockfile
          bash -n ops/scripts/*.sh
          shellcheck --severity=error ops/scripts/*.sh
          pnpm db:migrate
          pnpm test
          pnpm typecheck
          pnpm build
          pnpm audit --prod --audit-level high
      - name: Build immutable release
        shell: bash
        env:
          RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          test -n "$RELEASE_SIGNING_PRIVATE_KEY_B64"
          SIGNING_KEY=$(mktemp)
          trap 'rm -f -- "$SIGNING_KEY"' EXIT
          printf '%s' "$RELEASE_SIGNING_PRIVATE_KEY_B64" | base64 --decode > "$SIGNING_KEY"
          chmod 0600 "$SIGNING_KEY"
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_SIGNING_PRIVATE_KEY_FILE="$SIGNING_KEY" \
            service/ops/scripts/build-release.sh "$VERSION" "$GITHUB_WORKSPACE/releases"
      - name: Retain release for manual publication
        uses: actions/upload-artifact@v6
        with:
          name: LH-SSO-${{ github.ref_name }}
          path: releases/LH-SSO
          if-no-files-found: error
          retention-days: 7
      - name: Detect publication credential
        id: release_credentials
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [[ -n "$RELEASES_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out LH-Releases for publication
        if: steps.release_credentials.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: Legacy-Hosting/LH-Releases
          token: ${{ secrets.RELEASES_TOKEN }}
          path: publication
          lfs: true
      - name: Stage append-only publication
        if: steps.release_credentials.outputs.available == 'true'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="lh-sso-$version.tar.gz"
          sources=(
            "releases/LH-SSO/$archive"
            "releases/LH-SSO/SHA256/$archive.sha256"
            "releases/LH-SSO/SIGNATURES/$archive.sig"
          )
          test "$(find releases/LH-SSO -type f | wc -l)" -eq 3
          test "$(find releases/LH-SSO -type l | wc -l)" -eq 0
          for source in "${sources[@]}"; do
            test -f "$source"
            relative=${source#releases/}
            if [[ -e "publication/$relative" || -L "publication/$relative" ]]; then
              echo "Release artifact already exists: $relative" >&2
              exit 1
            fi
          done
          mkdir -p publication/LH-SSO
          cp -a releases/LH-SSO/. publication/LH-SSO/
      - name: Publish to LH-Releases
        if: steps.release_credentials.outputs.available == 'true'
        working-directory: publication
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          git lfs install --local
          git config user.name "Legacy Hosting Releases"
          git config user.email "releases@legacyhosting.xyz"
          git add LH-SSO
          git commit -m "release: LH-SSO ${RELEASE_VERSION#v}"
          git pull --rebase origin main
          git push origin HEAD:main
