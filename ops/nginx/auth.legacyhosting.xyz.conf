limit_req_zone $binary_remote_addr zone=legacy_sso:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name auth.legacyhosting.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.legacyhosting.xyz;

    ssl_certificate /etc/letsencrypt/live/auth.legacyhosting.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.legacyhosting.xyz/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/lh-sso.access.log;
    error_log /var/log/nginx/lh-sso.error.log;
    client_max_body_size 256k;
    limit_req zone=legacy_sso burst=20 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
